<!doctype html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>خريطة تعلّم React</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Cairo", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
            },
            colors: { react: "#61dafb" },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Cairo", sans-serif;
      }
      .glow {
        box-shadow:
          0 0 0 1px rgba(97, 218, 251, 0.25),
          0 10px 40px -10px rgba(97, 218, 251, 0.25);
      }
      .check {
        appearance: none;
        width: 1.35rem;
        height: 1.35rem;
        border-radius: 0.45rem;
        border: 2px solid #64748b;
        display: grid;
        place-content: center;
        cursor: pointer;
        transition: 0.15s;
        flex-shrink: 0;
      }
      .check:checked {
        background: #22c55e;
        border-color: #22c55e;
      }
      .check:checked::after {
        content: "✓";
        color: #fff;
        font-size: 0.85rem;
        font-weight: 800;
      }
      .panel {
        overflow: hidden;
        transition:
          max-height 0.35s ease,
          opacity 0.25s ease;
      }
      .spin-slow {
        animation: spin 14s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes pop {
        0% {
          transform: scale(0.9);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      .pop {
        animation: pop 0.3s ease;
      }
      pre code {
        font-family: "JetBrains Mono", monospace;
      }
      ::-webkit-scrollbar {
        height: 8px;
        width: 8px;
      }
      ::-webkit-scrollbar-thumb {
        background: #475569;
        border-radius: 8px;
      }
    </style>
  </head>

  <body
    class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen transition-colors"
  >
    <!-- شريط علوي -->
    <header
      class="sticky top-0 z-30 backdrop-blur bg-white/80 dark:bg-slate-950/80 border-b border-slate-200 dark:border-slate-800"
    >
      <div
        class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-3"
      >
        <div class="flex items-center gap-3">
          <span class="text-3xl spin-slow select-none" aria-hidden="true"
            >⚛️</span
          >
          <div>
            <h1 class="font-extrabold text-lg leading-tight">
              خريطة تعلّم React
            </h1>
            <p class="text-xs text-slate-500 dark:text-slate-400">
              مبنية على مشاريعك: ToolShare و AFCON و البورتفوليو
            </p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button
            id="themeBtn"
            class="px-3 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 hover:opacity-80 text-sm"
            title="تبديل الوضع"
          >
            🌙
          </button>
          <button
            id="resetBtn"
            class="px-3 py-2 rounded-xl bg-red-500/10 text-red-500 hover:bg-red-500/20 text-sm font-semibold"
          >
            إعادة ضبط
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 space-y-8">
      <!-- لوحة التقدّم -->
      <section class="grid md:grid-cols-3 gap-4">
        <div
          class="md:col-span-2 rounded-3xl p-6 bg-gradient-to-br from-sky-500/15 via-indigo-500/10 to-transparent border border-sky-500/20 glow"
        >
          <div class="flex items-center gap-6">
            <div class="relative w-32 h-32 shrink-0">
              <svg viewBox="0 0 120 120" class="w-32 h-32 -rotate-90">
                <circle
                  cx="60"
                  cy="60"
                  r="52"
                  fill="none"
                  stroke="currentColor"
                  class="text-slate-200 dark:text-slate-800"
                  stroke-width="10"
                />
                <circle
                  id="ring"
                  cx="60"
                  cy="60"
                  r="52"
                  fill="none"
                  stroke="#61dafb"
                  stroke-width="10"
                  stroke-linecap="round"
                  stroke-dasharray="326.73"
                  stroke-dashoffset="326.73"
                  style="transition: stroke-dashoffset 0.6s ease"
                />
              </svg>
              <div
                class="absolute inset-0 grid place-content-center text-center"
              >
                <div id="pct" class="text-3xl font-extrabold">0%</div>
              </div>
            </div>
            <div class="space-y-1">
              <div
                id="levelBadge"
                class="inline-block px-3 py-1 rounded-full bg-sky-500/20 text-sky-600 dark:text-sky-300 text-sm font-bold"
              ></div>
              <p id="countText" class="text-slate-600 dark:text-slate-300"></p>
              <p
                id="nextText"
                class="text-sm text-slate-500 dark:text-slate-400"
              ></p>
            </div>
          </div>
        </div>

        <div
          class="rounded-3xl p-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-3"
        >
          <h2 class="font-bold">🎯 أولوية هذا الأسبوع</h2>
          <p class="text-sm text-slate-600 dark:text-slate-400">
            المراحل المعلّمة بـ
            <span class="text-amber-500 font-bold">Sprint 3</span> تحتاجها
            لواجهة ToolShare قبل 04/12.
          </p>
          <div
            id="sprintBar"
            class="h-3 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden"
          >
            <div
              id="sprintFill"
              class="h-full bg-amber-400 transition-all duration-500"
              style="width: 0%"
            ></div>
          </div>
          <p
            id="sprintText"
            class="text-xs text-slate-500 dark:text-slate-400"
          ></p>
        </div>
      </section>

      <!-- الشارات -->
      <section>
        <h2 class="font-bold mb-3">🏅 الشارات</h2>
        <div id="badges" class="flex flex-wrap gap-2"></div>
      </section>

      <!-- فلاتر وبحث -->
      <section
        class="flex flex-col md:flex-row gap-3 md:items-center md:justify-between"
      >
        <div id="filters" class="flex flex-wrap gap-2"></div>
        <div class="flex gap-2">
          <input
            id="search"
            type="search"
            placeholder="ابحث: useEffect, Router, Zustand..."
            class="w-full md:w-72 px-4 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 outline-none focus:ring-2 focus:ring-sky-400 text-sm"
          />
          <button
            id="toggleAll"
            class="px-3 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-sm whitespace-nowrap"
          >
            فتح/طيّ الكل
          </button>
        </div>
      </section>

      <!-- المراحل -->
      <section id="phases" class="relative space-y-5"></section>
      <p id="empty" class="hidden text-center text-slate-500 py-10">
        لا توجد نتائج مطابقة 🤷
      </p>

      <footer
        class="text-center text-xs text-slate-500 dark:text-slate-500 pt-6 pb-10"
      >
        تقدّمك يُحفظ تلقائيًا في متصفحك. لتعديل الخريطة افتح ملف
        <code class="font-mono">data.js</code>.
      </footer>
    </main>

    <div
      id="toast"
      class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 hidden px-5 py-3 rounded-2xl bg-emerald-500 text-white font-bold shadow-xl"
    ></div>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
